<!DOCTYPE html>  
<html lang="en">  
<head>  
  <meta charset="UTF-8">  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  
  <title>Expense Tracker</title>  
  <script src="https://cdn.tailwindcss.com"></script>  
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>  
</head>  
<body class="bg-gray-50 p-6">  
  <div class="max-w-4xl mx-auto space-y-6">  
      
    <!-- Header -->  
    <header class="flex justify-between items-center bg-white p-6 rounded-xl shadow-sm">  
      <div>  
        <h1 class="text-2xl font-bold text-gray-800">Expense Tracker</h1>  
        <p class="text-sm text-gray-500">Track and categorize your spending</p>  
      </div>  
      <div class="text-right">  
        <span class="text-sm text-gray-500">Total Spent</span>  
        <div id="totalAmount" class="text-3xl font-extrabold text-indigo-600">$0.00</div>  
      </div>  
    </header>  
  
    <!-- Content Grid -->  
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">  
        
      <!-- Input Form -->  
      <div class="bg-white p-6 rounded-xl shadow-sm md:col-span-1">  
        <h2 class="text-lg font-semibold text-gray-700 mb-4">Add Expense</h2>  
        <form id="expenseForm" class="space-y-4">  
          <div>  
            <label class="block text-xs font-semibold text-gray-500 uppercase">Title</label>  
            <input type="text" id="title" required class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="e.g. Groceries">  
          </div>  
          <div>  
            <label class="block text-xs font-semibold text-gray-500 uppercase">Amount ($)</label>  
            <input type="number" step="0.01" id="amount" required class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="0.00">  
          </div>  
          <div>  
            <label class="block text-xs font-semibold text-gray-500 uppercase">Category</label>  
            <select id="category" class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">  
              <option>Food</option>  
              <option>Transport</option>  
              <option>Housing</option>  
              <option>Entertainment</option>  
              <option>Utilities</option>  
              <option>Other</option>  
            </select>  
          </div>  
          <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-lg transition">Add Entry</button>  
        </form>  
      </div>  
  
      <!-- Breakdown Chart -->  
      <div class="bg-white p-6 rounded-xl shadow-sm md:col-span-2 flex flex-col justify-center items-center">  
        <h2 class="text-lg font-semibold text-gray-700 w-full mb-2">Category Breakdown</h2>  
        <div class="w-64 h-64">  
          <canvas id="expenseChart"></canvas>  
        </div>  
      </div>  
  
    </div>  
  
    <!-- Expense List -->  
    <div class="bg-white p-6 rounded-xl shadow-sm">  
      <h2 class="text-lg font-semibold text-gray-700 mb-4">Recent Transactions</h2>  
      <div class="overflow-x-auto">  
        <table class="w-full text-left border-collapse">  
          <thead>  
            <tr class="border-b text-xs font-semibold text-gray-500 uppercase">  
              <th class="pb-3">Title</th>  
              <th class="pb-3">Category</th>  
              <th class="pb-3">Amount</th>  
              <th class="pb-3 text-right">Action</th>  
            </tr>  
          </thead>  
          <tbody id="expenseList" class="divide-y text-sm text-gray-700">  
            <!-- Dynamic Rows -->  
          </tbody>  
        </table>  
      </div>  
    </div>  
  
  </div>  
  
  <script>  
    let expenses = JSON.parse(localStorage.getItem('expenses')) || [];  
    let chart;  
  
    const form = document.getElementById('expenseForm');  
    const expenseList = document.getElementById('expenseList');  
    const totalAmount = document.getElementById('totalAmount');  
  
    function updateUI() {  
      expenseList.innerHTML = '';  
      let total = 0;  
      const categories = {};  
  
      expenses.forEach((expense, index) => {  
        total += expense.amount;  
        categories[expense.category] = (categories[expense.category] || 0) + expense.amount;  
  
        const row = document.createElement('tr');  
        row.innerHTML = `  
          <td class="py-3 font-medium">${expense.title}</td>  
          <td class="py-3"><span class="px-2 py-1 bg-gray-100 rounded-md text-xs">${expense.category}</span></td>  
          <td class="py-3">$${expense.amount.toFixed(2)}</td>  
          <td class="py-3 text-right">  
            <button onclick="deleteExpense(${index})" class="text-red-500 hover:text-red-700 font-medium text-xs">Delete</button>  
          </td>  
        `;  
        expenseList.appendChild(row);  
      });  
  
      totalAmount.innerText = `$${total.toFixed(2)}`;  
      localStorage.setItem('expenses', JSON.stringify(expenses));  
      updateChart(categories);  
    }  
  
    function updateChart(categories) {  
      const ctx = document.getElementById('expenseChart').getContext('2d');  
      const labels = Object.keys(categories);  
      const data = Object.values(categories);  
  
      if (chart) chart.destroy();  
  
      chart = new Chart(ctx, {  
        type: 'doughnut',  
        data: {  
          labels: labels,  
          datasets: [{  
            data: data,  
            backgroundColor: ['#6366F1', '#10B981', '#F59E0B', '#EF4444', '#8B5CF6', '#6B7280']  
          }]  
        },  
        options: { responsive: true, maintainAspectRatio: false }  
      });  
    }  
  
    form.addEventListener('submit', (e) => {  
      e.preventDefault();  
      const title = document.getElementById('title').value;  
      const amount = parseFloat(document.getElementById('amount').value);  
      const category = document.getElementById('category').value;  
  
      expenses.push({ title, amount, category });  
      form.reset();  
      updateUI();  
    });  
  
    function deleteExpense(index) {  
      expenses.splice(index, 1);  
      updateUI();  
    }  
  
    updateUI();  
  </script>  
</body>  
</html>
