<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Willis Pickle Watson - Pro Matchmaker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-24 font-sans select-none">

  <!-- HEADER -->
  <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-10 shadow-md flex justify-between items-center">
    <div class="flex items-center gap-3">
      <svg class="w-10 h-10 flex-shrink-0" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M25 40 C25 25, 75 25, 75 40 Z" fill="#334155"/>
        <path d="M15 40 C15 37, 85 37, 85 40 L80 44 L20 44 Z" fill="#1E293B"/>
        <path d="M40 28 C45 28, 55 28, 60 28 L58 37 L42 37 Z" fill="#475569"/>
        <circle cx="50" cy="62" r="22" fill="#4ADE80" stroke="#16A34A" stroke-width="2"/>
        <circle cx="42" cy="56" r="2.5" fill="#16A34A"/>
        <circle cx="58" cy="56" r="2.5" fill="#16A34A"/>
        <circle cx="50" cy="64" r="2.5" fill="#16A34A"/>
        <circle cx="40" cy="68" r="2" fill="#16A34A"/>
        <circle cx="60" cy="68" r="2" fill="#16A34A"/>
        <circle cx="57" cy="56" r="6" stroke="#F59E0B" stroke-width="1.5" fill="none"/>
        <path d="M63 56 Q68 62 70 72" stroke="#F59E0B" stroke-width="1.5" fill="none"/>
      </svg>
      <div>
        <h1 class="text-base font-black tracking-wider text-green-400 uppercase leading-none">Pickle Watson</h1>
        <p id="sessionSummary" class="text-[11px] text-slate-400 mt-1">0 Active · 1 Court</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <span id="roundsBadge" class="text-xs bg-slate-700 text-green-300 font-bold px-2 py-1 rounded-lg border border-slate-600">0 Matches</span>
      <button onclick="resetSession()" class="text-xs bg-red-900/40 text-red-300 border border-red-700/50 px-2.5 py-1 rounded-lg active:bg-red-800">Reset</button>
    </div>
  </header>

  <main class="p-4 max-w-md mx-auto space-y-5">

    <!-- TAB 1: QUEUE -->
    <div id="tab-play" class="tab-content active space-y-5">
      <!-- DASHBOARD STATS -->
      <div class="grid grid-cols-2 gap-2 text-xs">
        <div class="bg-slate-800/80 border border-slate-700 p-3 rounded-xl">
          <span class="text-slate-400 block text-[10px] uppercase">Session Target</span>
          <span id="targetCalc" class="font-bold text-slate-200 text-sm">~0 games/player</span>
        </div>
        <div class="bg-slate-800/80 border border-slate-700 p-3 rounded-xl text-right">
          <span class="text-slate-400 block text-[10px] uppercase">Pacing Est.</span>
          <span id="pacingCalc" class="font-bold text-green-400 text-sm">~15m / match</span>
        </div>
      </div>

      <!-- COURTS -->
      <section>
        <div class="flex justify-between items-center mb-2">
          <h2 class="text-sm font-bold uppercase tracking-wider text-slate-400">Courts Lineup</h2>
          <button onclick="nextRound()" class="bg-green-500 hover:bg-green-600 text-slate-950 font-bold px-3 py-1.5 rounded-xl text-xs shadow-lg shadow-green-500/20 active:scale-95 transition">⚡ Fill Empty Courts</button>
        </div>
        <div id="courtsContainer" class="space-y-3"></div>
      </section>

      <!-- BENCH -->
      <section>
        <div class="flex justify-between items-center mb-2">
          <h2 class="text-sm font-bold uppercase tracking-wider text-slate-400">Bench (Queue Priority)</h2>
          <span id="benchCount" class="text-[11px] text-slate-400">0 Waiting</span>
        </div>
        <div id="benchList" class="grid grid-cols-2 gap-2"></div>
      </section>
    </div>

    <!-- TAB 2: PLAYERS -->
    <div id="tab-players" class="tab-content space-y-5">
      <section class="bg-slate-800 p-4 rounded-2xl border border-slate-700 space-y-4">
        <h2 class="text-sm font-bold text-slate-200 uppercase tracking-wider">Session Settings</h2>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-xs text-slate-400 block mb-1">Duration</label>
            <select id="sessionHours" onchange="updatePlanner()" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-xs text-slate-200 outline-none">
              <option value="1">1 Hour</option>
              <option value="2">2 Hours</option>
              <option value="3">3 Hours</option>
              <option value="4">4 Hours</option>
            </select>
          </div>
          <div>
            <label class="text-xs text-slate-400 block mb-1">Courts</label>
            <select id="courtCount" onchange="updatePlanner()" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-xs text-slate-200 outline-none">
              <option value="1">1 Court</option>
              <option value="2">2 Courts</option>
              <option value="3">3 Courts</option>
              <option value="4">4 Courts</option>
            </select>
          </div>
        </div>
      </section>

      <section class="bg-slate-800 p-4 rounded-2xl border border-slate-700 space-y-3">
        <h2 class="text-sm font-bold text-slate-200 uppercase tracking-wider">Add Player</h2>
        <form id="addPlayerForm" class="flex gap-2">
          <input type="text" id="playerName" placeholder="Player name..." autocomplete="off" autocapitalize="words" required class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-slate-200 outline-none focus:border-green-400">
          <button type="submit" class="bg-green-500 text-slate-950 font-bold px-4 py-2.5 rounded-xl text-xs active:scale-95">Add</button>
        </form>
      </section>

      <section>
        <h2 class="text-sm font-bold uppercase tracking-wider text-slate-400 mb-2">Roster & Status</h2>
        <div id="rosterList" class="space-y-2"></div>
      </section>
    </div>

    <!-- TAB 3: LEADERBOARD -->
    <div id="tab-leaderboard" class="tab-content space-y-4">
      <h2 class="text-sm font-bold uppercase tracking-wider text-slate-400">Session Rankings</h2>
      <div class="bg-slate-800 rounded-2xl border border-slate-700 overflow-hidden">
        <table class="w-full text-left text-xs">
          <thead class="bg-slate-900/50 text-slate-400 border-b border-slate-700">
            <tr>
              <th class="p-3"># & Player</th>
              <th class="p-3 text-center">Played</th>
              <th class="p-3 text-center">W - L</th>
              <th class="p-3 text-right">Win %</th>
            </tr>
          </thead>
          <tbody id="leaderboardBody" class="divide-y divide-slate-700/50 text-slate-200"></tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- BOTTOM BAR -->
  <nav class="fixed bottom-0 left-0 right-0 bg-slate-800/95 backdrop-blur-md border-t border-slate-700 px-6 py-2 flex justify-around items-center z-20">
    <button onclick="switchTab('play')" id="nav-play" class="flex flex-col items-center gap-1 text-green-400">
      <span class="text-lg">🏸</span>
      <span class="text-[10px] font-bold">Queue</span>
    </button>
    <button onclick="switchTab('players')" id="nav-players" class="flex flex-col items-center gap-1 text-slate-400">
      <span class="text-lg">👥</span>
      <span class="text-[10px] font-bold">Players</span>
    </button>
    <button onclick="switchTab('leaderboard')" id="nav-leaderboard" class="flex flex-col items-center gap-1 text-slate-400">
      <span class="text-lg">🏆</span>
      <span class="text-[10px] font-bold">Rankings</span>
    </button>
  </nav>

  <script>
    const DEFAULT_STATE = {
      players: [],
      courts: [{ id: 1, team1: [], team2: [], active: false }],
      settings: { hours: 3, courtCount: 1 },
      totalMatchesCompleted: 0,
      partnerHistory: {} // 'idA_idB': count
    };

    let state = JSON.parse(localStorage.getItem('wpw_state')) || DEFAULT_STATE;
    if (!state.partnerHistory) state.partnerHistory = {};
    if (typeof state.totalMatchesCompleted === 'undefined') state.totalMatchesCompleted = 0;
    if (!state.settings) state.settings = { hours: 3, courtCount: 1 };

    function saveState() {
      localStorage.setItem('wpw_state', JSON.stringify(state));
      render();
    }

    const getPlayer = (id) => state.players.find(p => p.id === Number(id));

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.getElementById(`tab-${tabId}`).classList.add('active');
      ['play', 'players', 'leaderboard'].forEach(t => {
        document.getElementById(`nav-${t}`).className = t === tabId 
          ? "flex flex-col items-center gap-1 text-green-400" 
          : "flex flex-col items-center gap-1 text-slate-400";
      });
    }

    // FORM: Add Player
    document.getElementById('addPlayerForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const input = document.getElementById('playerName');
      const name = input.value.trim();
      if (name) {
        const activePlayers = state.players.filter(p => p.activeStatus !== 'standby');
        const minGamesPlayed = activePlayers.length > 0 ? Math.min(...activePlayers.map(p => p.gamesPlayed)) : 0;

        state.players.push({
          id: Date.now(),
          name: name,
          gamesPlayed: minGamesPlayed,
          wins: 0,
          losses: 0,
          restingRounds: 10,
          activeStatus: 'active'
        });
        input.value = '';
        saveState();
      }
    });

    function togglePlayerStatus(id) {
      const p = getPlayer(id);
      if (!p) return;
      
      p.activeStatus = p.activeStatus === 'standby' ? 'active' : 'standby';
      
      // If player paused mid-game, free their court
      if (p.activeStatus === 'standby') {
        state.courts.forEach(court => {
          if (court.team1.includes(id) || court.team2.includes(id)) {
            court.active = false;
            court.team1 = [];
            court.team2 = [];
          }
        });
      }
      saveState();
    }

    function deletePlayer(id) {
      state.players = state.players.filter(p => p.id !== id);
      // Clean up court slots safely
      state.courts.forEach(court => {
        if (court.team1.includes(id) || court.team2.includes(id)) {
          court.active = false;
          court.team1 = [];
          court.team2 = [];
        }
      });
      saveState();
    }

    function updatePlanner() {
      const hours = parseInt(document.getElementById('sessionHours').value);
      const courts = parseInt(document.getElementById('courtCount').value);
      
      state.settings.hours = hours;
      state.settings.courtCount = courts;

      while (state.courts.length < courts) {
        state.courts.push({ id: state.courts.length + 1, team1: [], team2: [], active: false });
      }
      while (state.courts.length > courts) {
        state.courts.pop();
      }

      const activePlayers = state.players.filter(p => p.activeStatus !== 'standby').length;
      if (activePlayers > 0) {
        const totalGamesPossible = hours * courts * 4;
        const targetPerPlayer = Math.floor((totalGamesPossible * 4) / activePlayers);
        document.getElementById('targetCalc').innerText = `~${targetPerPlayer} games / player`;
        document.getElementById('pacingCalc').innerText = `~15 mins / match`;
      } else {
        document.getElementById('targetCalc').innerText = `~0 games / player`;
      }
      saveState();
    }

    // Helper: calculate times two players were paired
    function getPairKey(id1, id2) {
      return [id1, id2].sort((a,b) => a - b).join('_');
    }

    function getPartnershipCount(id1, id2) {
      return state.partnerHistory[getPairKey(id1, id2)] || 0;
    }

    // MATCHMAKER ENGINE
    function nextRound() {
      const currentlyOnCourtIds = state.courts.filter(c => c.active).flatMap(c => [...c.team1, ...c.team2]);

      let availablePool = state.players
        .filter(p => p.activeStatus !== 'standby' && !currentlyOnCourtIds.includes(p.id))
        .sort((a, b) => {
          if (a.gamesPlayed !== b.gamesPlayed) return a.gamesPlayed - b.gamesPlayed;
          return b.restingRounds - a.restingRounds;
        });

      const openCourts = state.courts.filter(c => !c.active);

      if (openCourts.length === 0) {
        alert("All courts are currently active!");
        return;
      }

      if (availablePool.length < 4) {
        alert("Need at least 4 available players on the bench to fill an open court!");
        return;
      }

      openCourts.forEach(court => {
        if (availablePool.length >= 4) {
          const fourPlayers = availablePool.splice(0, 4);

          // Pair the 4 players to minimize previous partnership overlap
          // 3 possible pairings: (0,1 vs 2,3), (0,2 vs 1,3), (0,3 vs 1,2)
          const p = fourPlayers;
          const combinations = [
            { t1: [p[0], p[1]], t2: [p[2], p[3]], score: getPartnershipCount(p[0].id, p[1].id) + getPartnershipCount(p[2].id, p[3].id) },
            { t1: [p[0], p[2]], t2: [p[1], p[3]], score: getPartnershipCount(p[0].id, p[2].id) + getPartnershipCount(p[1].id, p[3].id) },
            { t1: [p[0], p[3]], t2: [p[1], p[2]], score: getPartnershipCount(p[0].id, p[3].id) + getPartnershipCount(p[1].id, p[2].id) }
          ];

          combinations.sort((a, b) => a.score - b.score);
          const best = combinations[0];

          court.team1 = [best.t1[0].id, best.t1[1].id];
          court.team2 = [best.t2[0].id, best.t2[1].id];
          court.active = true;
        }
      });

      // Increment rest counter for remaining bench players
      const allActiveIds = state.courts.filter(c => c.active).flatMap(c => [...c.team1, ...c.team2]);
      state.players.forEach(p => {
        if (!allActiveIds.includes(p.id) && p.activeStatus !== 'standby') {
          p.restingRounds++;
        }
      });

      saveState();
    }

    // MANUAL ON-COURT SWAPS
    function swapCourtPlayer(courtIdx, teamNum, slotIdx, newPlayerId) {
      const targetId = Number(newPlayerId);
      const court = state.courts[courtIdx];
      const targetTeam = teamNum === 1 ? court.team1 : court.team2;
      const oldPlayerId = targetTeam[slotIdx];

      if (oldPlayerId === targetId) return;

      // If chosen player is in team 1
      const inT1 = court.team1.indexOf(targetId);
      const inT2 = court.team2.indexOf(targetId);

      if (inT1 !== -1) {
        court.team1[inT1] = oldPlayerId;
      } else if (inT2 !== -1) {
        court.team2[inT2] = oldPlayerId;
      }

      targetTeam[slotIdx] = targetId;
      saveState();
    }

    // WIN RECORDING
    function recordWinner(courtIdx, winningTeam) {
      const court = state.courts[courtIdx];
      if (!court.active) return;

      const winners = winningTeam === 1 ? court.team1 : court.team2;
      const losers = winningTeam === 1 ? court.team2 : court.team1;

      // Track partnership synergy
      const keyT1 = getPairKey(court.team1[0], court.team1[1]);
      const keyT2 = getPairKey(court.team2[0], court.team2[1]);
      state.partnerHistory[keyT1] = (state.partnerHistory[keyT1] || 0) + 1;
      state.partnerHistory[keyT2] = (state.partnerHistory[keyT2] || 0) + 1;

      winners.forEach(id => {
        const p = getPlayer(id);
        if (p) { p.wins++; p.gamesPlayed++; p.restingRounds = 0; }
      });

      losers.forEach(id => {
        const p = getPlayer(id);
        if (p) { p.losses++; p.gamesPlayed++; p.restingRounds = 0; }
      });

      state.totalMatchesCompleted++;
      court.active = false;
      court.team1 = [];
      court.team2 = [];
      saveState();
    }

    function getPlayerSelectOptions(selectedId) {
      return state.players.map(p => `
        <option value="${p.id}" ${p.id === selectedId ? 'selected' : ''}>
          ${p.name} (${p.gamesPlayed}G) ${p.activeStatus === 'standby' ? '⏸' : ''}
        </option>
      `).join('');
    }

    function render() {
      // Sync form settings
      document.getElementById('sessionHours').value = state.settings.hours;
      document.getElementById('courtCount').value = state.settings.courtCount;

      const activePlayers = state.players.filter(p => p.activeStatus !== 'standby');
      document.getElementById('sessionSummary').innerText = `${activePlayers.length} Active (${state.players.length} Roster) · ${state.courts.length} Court(s)`;
      document.getElementById('roundsBadge').innerText = `${state.totalMatchesCompleted} Matches Done`;

      // Render Courts
      const courtsContainer = document.getElementById('courtsContainer');
      courtsContainer.innerHTML = '';
      
      state.courts.forEach((court, idx) => {
        const div = document.createElement('div');
        div.className = "bg-slate-800 border border-slate-700 p-4 rounded-2xl space-y-3 shadow-sm";
        if (court.active && court.team1.length === 2 && court.team2.length === 2) {
          div.innerHTML = `
            <div class="flex justify-between items-center border-b border-slate-700/60 pb-2">
              <span class="text-xs font-bold text-green-400 uppercase tracking-wider">Court ${court.id} (In Game)</span>
              <span class="text-[10px] text-slate-400">Select player to swap</span>
            </div>
            <div class="grid grid-cols-2 gap-2 text-center text-xs">
              <div class="bg-slate-900/80 p-2.5 rounded-xl border border-slate-700 space-y-1.5">
                <span class="text-slate-400 block text-[10px] uppercase font-bold tracking-wider">Team 1</span>
                
                <select onchange="swapCourtPlayer(${idx}, 1, 0, this.value)" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-1 text-slate-200 text-xs font-bold outline-none">
                  ${getPlayerSelectOptions(court.team1[0])}
                </select>
                <select onchange="swapCourtPlayer(${idx}, 1, 1, this.value)" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-1 text-slate-200 text-xs font-bold outline-none">
                  ${getPlayerSelectOptions(court.team1[1])}
                </select>

                <button onclick="recordWinner(${idx}, 1)" class="mt-2 w-full bg-green-500/20 text-green-300 border border-green-500/40 py-1.5 rounded-lg font-bold hover:bg-green-500/30 active:scale-95 transition">Team 1 Won</button>
              </div>

              <div class="bg-slate-900/80 p-2.5 rounded-xl border border-slate-700 space-y-1.5">
                <span class="text-slate-400 block text-[10px] uppercase font-bold tracking-wider">Team 2</span>
                
                <select onchange="swapCourtPlayer(${idx}, 2, 0, this.value)" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-1 text-slate-200 text-xs font-bold outline-none">
                  ${getPlayerSelectOptions(court.team2[0])}
                </select>
                <select onchange="swapCourtPlayer(${idx}, 2, 1, this.value)" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-1 text-slate-200 text-xs font-bold outline-none">
                  ${getPlayerSelectOptions(court.team2[1])}
                </select>

                <button onclick="recordWinner(${idx}, 2)" class="mt-2 w-full bg-green-500/20 text-green-300 border border-green-500/40 py-1.5 rounded-lg font-bold hover:bg-green-500/30 active:scale-95 transition">Team 2 Won</button>
              </div>
            </div>
          `;
        } else {
          div.innerHTML = `
            <div class="flex justify-between items-center text-xs py-1">
              <span class="font-bold text-slate-400 uppercase tracking-wider">Court ${court.id}</span>
              <span class="text-slate-500 italic bg-slate-900/50 px-2.5 py-0.5 rounded-md border border-slate-800">Available</span>
            </div>
          `;
        }
        courtsContainer.appendChild(div);
      });

      // Render Bench with Queue Priority
      const activeCourtIds = state.courts.filter(c => c.active).flatMap(c => [...c.team1, ...c.team2]);
      const benchList = document.getElementById('benchList');
      benchList.innerHTML = '';

      const waitingPlayers = state.players
        .filter(p => !activeCourtIds.includes(p.id))
        .sort((a, b) => {
          if (a.activeStatus === 'standby' && b.activeStatus !== 'standby') return 1;
          if (b.activeStatus === 'standby' && a.activeStatus !== 'standby') return -1;
          if (a.gamesPlayed !== b.gamesPlayed) return a.gamesPlayed - b.gamesPlayed;
          return b.restingRounds - a.restingRounds;
        });

      document.getElementById('benchCount').innerText = `${waitingPlayers.filter(p => p.activeStatus !== 'standby').length} Waiting`;

      waitingPlayers.forEach((p, queueIdx) => {
        const isStandby = p.activeStatus === 'standby';
        const card = document.createElement('div');
        card.className = `p-2.5 rounded-xl flex justify-between items-center text-xs border ${isStandby ? 'bg-slate-900/50 border-slate-800 opacity-50' : 'bg-slate-800/80 border-slate-700/80'}`;
        card.innerHTML = `
          <div>
            <div class="flex items-center gap-1.5">
              ${!isStandby ? `<span class="text-[9px] bg-slate-700 font-bold px-1 rounded text-slate-300">#${queueIdx + 1}</span>` : ''}
              <span class="font-bold text-slate-200">${p.name}</span>
            </div>
            <span class="text-[10px] text-slate-400">${p.gamesPlayed} played · rested ${p.restingRounds}r</span>
          </div>
          <span class="px-2 py-0.5 rounded-full text-[10px] font-semibold ${isStandby ? 'bg-amber-900/40 text-amber-300 border border-amber-800/50' : 'bg-green-900/30 text-green-300 border border-green-800/40'}">
            ${isStandby ? 'AFK' : 'Ready'}
          </span>
        `;
        benchList.appendChild(card);
      });

      // Render Roster Manager
      const rosterList = document.getElementById('rosterList');
      rosterList.innerHTML = '';
      state.players.forEach(p => {
        const isStandby = p.activeStatus === 'standby';
        const row = document.createElement('div');
        row.className = "bg-slate-800 border border-slate-700 p-3 rounded-xl flex justify-between items-center text-xs";
        row.innerHTML = `
          <div>
            <span class="font-bold text-slate-200 block">${p.name}</span>
            <span class="text-[10px] text-slate-400">${p.gamesPlayed} games (${p.wins}W - ${p.losses}L)</span>
          </div>
          <div class="flex gap-2">
            <button onclick="togglePlayerStatus(${p.id})" class="px-2.5 py-1 rounded-lg font-bold text-[10px] transition ${isStandby ? 'bg-amber-500/20 text-amber-300 border border-amber-500/30' : 'bg-slate-700 text-slate-300'}">
              ${isStandby ? 'Resume' : 'Pause'}
            </button>
            <button onclick="deletePlayer(${p.id})" class="text-red-400 hover:text-red-300 font-bold px-1.5">✕</button>
          </div>
        `;
        rosterList.appendChild(row);
      });

      // Render Leaderboard
      const leaderboardBody = document.getElementById('leaderboardBody');
      leaderboardBody.innerHTML = '';
      
      const rankedPlayers = [...state.players].sort((a,b) => {
        const winPctA = a.gamesPlayed ? (a.wins / a.gamesPlayed) : 0;
        const winPctB = b.gamesPlayed ? (b.wins / b.gamesPlayed) : 0;
        if (b.wins !== a.wins) return b.wins - a.wins; // Total wins first
        return winPctB - winPctA;                      // Win rate second
      });

      rankedPlayers.forEach((p, rankIdx) => {
        const winPct = p.gamesPlayed ? Math.round((p.wins / p.gamesPlayed) * 100) : 0;
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="p-3">
            <span class="text-slate-500 font-mono mr-1.5">${rankIdx + 1}.</span>
            <span class="font-bold text-slate-100">${p.name}</span>
            ${p.activeStatus === 'standby' ? '<span class="text-[9px] text-amber-400 ml-1">(AFK)</span>' : ''}
          </td>
          <td class="p-3 text-center text-slate-400 font-mono">${p.gamesPlayed}</td>
          <td class="p-3 text-center text-slate-300 font-mono">${p.wins} - ${p.losses}</td>
          <td class="p-3 text-right font-bold font-mono ${winPct >= 50 ? 'text-green-400' : 'text-slate-400'}">${winPct}%</td>
        `;
        leaderboardBody.appendChild(tr);
      });
    }

    function resetSession() {
      if (confirm("Reset match scores, match counts, and clear active courts? (Player roster will be preserved)")) {
        state.players.forEach(p => { 
          p.gamesPlayed = 0; 
          p.wins = 0; 
          p.losses = 0; 
          p.restingRounds = 10; 
        });
        state.courts.forEach(c => { 
          c.active = false; 
          c.team1 = []; 
          c.team2 = []; 
        });
        state.totalMatchesCompleted = 0;
        state.partnerHistory = {};
        saveState();
      }
    }

    updatePlanner();
    render();
  </script>
</body>
</html>
