<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Willis Pickle Watson</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-24 font-sans select-none">

  <!-- HEADER -->
  <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-10 shadow-md flex justify-between items-center">
    <div class="flex items-center gap-3">
      <svg class="w-10 h-10 flex-shrink-0" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M25 40 C25 25, 75 25, 75 40 Z" fill="#334155"/>
        <path d="M15 40 C15 37, 85 37, 85 40 L80 44 L20 44 Z" fill="#1E293B"/>
        <path d="M40 28 C45 28, 55 28, 60 28 L58 37 L42 37 Z" fill="#475569"/>
        <circle cx="50" cy="62" r="22" fill="#4ADE80" stroke="#16A34A" stroke-width="2"/>
        <circle cx="42" cy="56" r="2.5" fill="#16A34A"/>
        <circle cx="58" cy="56" r="2.5" fill="#16A34A"/>
        <circle cx="50" cy="64" r="2.5" fill="#16A34A"/>
        <circle cx="40" cy="68" r="2" fill="#16A34A"/>
        <circle cx="60" cy="68" r="2" fill="#16A34A"/>
        <circle cx="57" cy="56" r="6" stroke="#F59E0B" stroke-width="1.5" fill="none"/>
        <path d="M63 56 Q68 62 70 72" stroke="#F59E0B" stroke-width="1.5" fill="none"/>
      </svg>
      <div>
        <h1 class="text-base font-black tracking-wider text-green-400 uppercase leading-none">Willis Pickle Watson</h1>
        <p id="sessionSummary" class="text-[11px] text-slate-400 mt-1">0 Active · 1 Court</p>
      </div>
    </div>
    <button onclick="resetSession()" class="text-xs bg-red-900/40 text-red-300 border border-red-700/50 px-3 py-1.5 rounded-lg active:bg-red-800">Reset</button>
  </header>

  <main class="p-4 max-w-md mx-auto space-y-5">

    <!-- TAB 1: QUEUE -->
    <div id="tab-play" class="tab-content active space-y-5">
      <div class="bg-slate-800/80 border border-slate-700 p-3.5 rounded-2xl flex justify-between items-center text-xs">
        <div>
          <span class="text-slate-400 block">Session Target</span>
          <span id="targetCalc" class="font-bold text-slate-200">~0 games / player</span>
        </div>
        <div class="text-right">
          <span class="text-slate-400 block">Pacing</span>
          <span id="pacingCalc" class="font-bold text-green-400">0 mins / game</span>
        </div>
      </div>

      <section>
        <div class="flex justify-between items-center mb-2">
          <h2 class="text-sm font-bold uppercase tracking-wider text-slate-400">Active Courts</h2>
          <button onclick="nextRound()" class="bg-green-500 hover:bg-green-600 text-slate-950 font-bold px-3 py-1.5 rounded-xl text-xs shadow-lg shadow-green-500/20 active:scale-95 transition">⚡ Deduce Matches</button>
        </div>
        <div id="courtsContainer" class="space-y-3"></div>
      </section>

      <section>
        <h2 class="text-sm font-bold uppercase tracking-wider text-slate-400 mb-2">Bench / Queue</h2>
        <div id="benchList" class="grid grid-cols-2 gap-2"></div>
      </section>
    </div>

    <!-- TAB 2: PLAYERS -->
    <div id="tab-players" class="tab-content space-y-5">
      <section class="bg-slate-800 p-4 rounded-2xl border border-slate-700 space-y-4">
        <h2 class="text-sm font-bold text-slate-200 uppercase tracking-wider">Session Settings</h2>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-xs text-slate-400 block mb-1">Duration</label>
            <select id="sessionHours" onchange="updatePlanner()" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-xs text-slate-200 outline-none">
              <option value="1">1 Hour</option>
              <option value="2">2 Hours</option>
              <option value="3" selected>3 Hours</option>
              <option value="4">4 Hours</option>
            </select>
          </div>
          <div>
            <label class="text-xs text-slate-400 block mb-1">Courts</label>
            <select id="courtCount" onchange="updatePlanner()" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-xs text-slate-200 outline-none">
              <option value="1" selected>1 Court</option>
              <option value="2">2 Courts</option>
              <option value="3">3 Courts</option>
            </select>
          </div>
        </div>
      </section>

      <section class="bg-slate-800 p-4 rounded-2xl border border-slate-700 space-y-3">
        <h2 class="text-sm font-bold text-slate-200 uppercase tracking-wider">Add Player</h2>
        <form id="addPlayerForm" class="flex gap-2">
          <input type="text" id="playerName" placeholder="Player name..." required class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-slate-200 outline-none focus:border-green-400">
          <button type="submit" class="bg-green-500 text-slate-950 font-bold px-4 py-2.5 rounded-xl text-xs active:scale-95">Add</button>
        </form>
      </section>

      <section>
        <h2 class="text-sm font-bold uppercase tracking-wider text-slate-400 mb-2">Roster & Status</h2>
        <div id="rosterList" class="space-y-2"></div>
      </section>
    </div>

    <!-- TAB 3: LEADERBOARD -->
    <div id="tab-leaderboard" class="tab-content space-y-4">
      <h2 class="text-sm font-bold uppercase tracking-wider text-slate-400">Leaderboard</h2>
      <div class="bg-slate-800 rounded-2xl border border-slate-700 overflow-hidden">
        <table class="w-full text-left text-xs">
          <thead class="bg-slate-900/50 text-slate-400 border-b border-slate-700">
            <tr>
              <th class="p-3">Player</th>
              <th class="p-3 text-center">Played</th>
              <th class="p-3 text-center">W - L</th>
              <th class="p-3 text-right">Win %</th>
            </tr>
          </thead>
          <tbody id="leaderboardBody" class="divide-y divide-slate-700/50 text-slate-200"></tbody>
        </table>
      </div>
    </div>
  </main>

  <nav class="fixed bottom-0 left-0 right-0 bg-slate-800/95 backdrop-blur-md border-t border-slate-700 px-6 py-2 flex justify-around items-center z-20">
    <button onclick="switchTab('play')" id="nav-play" class="flex flex-col items-center gap-1 text-green-400">
      <span class="text-lg">🔎</span>
      <span class="text-[10px] font-bold">Queue</span>
    </button>
    <button onclick="switchTab('players')" id="nav-players" class="flex flex-col items-center gap-1 text-slate-400">
      <span class="text-lg">👥</span>
      <span class="text-[10px] font-bold">Players</span>
    </button>
    <button onclick="switchTab('leaderboard')" id="nav-leaderboard" class="flex flex-col items-center gap-1 text-slate-400">
      <span class="text-lg">🏆</span>
      <span class="text-[10px] font-bold">Rankings</span>
    </button>
  </nav>

  <script>
    let state = JSON.parse(localStorage.getItem('wpw_state')) || {
      players: [],
      courts: [{ id: 1, team1: [], team2: [], active: false }]
    };

    function saveState() {
      localStorage.setItem('wpw_state', JSON.stringify(state));
      render();
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.getElementById(`tab-${tabId}`).classList.add('active');
      ['play', 'players', 'leaderboard'].forEach(t => {
        document.getElementById(`nav-${t}`).className = t === tabId 
          ? "flex flex-col items-center gap-1 text-green-400" 
          : "flex flex-col items-center gap-1 text-slate-400";
      });
    }

    document.getElementById('addPlayerForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const input = document.getElementById('playerName');
      const name = input.value.trim();
      if (name) {
        const activePlayers = state.players.filter(p => p.activeStatus !== 'standby');
        const minGamesPlayed = activePlayers.length > 0 ? Math.min(...activePlayers.map(p => p.gamesPlayed)) : 0;

        state.players.push({
          id: Date.now(),
          name: name,
          gamesPlayed: minGamesPlayed,
          wins: 0,
          losses: 0,
          restingRounds: 100,
          activeStatus: 'active'
        });
        input.value = '';
        saveState();
      }
    });

    function togglePlayerStatus(id) {
      const p = state.players.find(x => x.id === id);
      if (p) {
        p.activeStatus = p.activeStatus === 'standby' ? 'active' : 'standby';
        saveState();
      }
    }

    function deletePlayer(id) {
      state.players = state.players.filter(p => p.id !== id);
      saveState();
    }

    function updatePlanner() {
      const hours = parseInt(document.getElementById('sessionHours').value);
      const courts = parseInt(document.getElementById('courtCount').value);
      
      while(state.courts.length < courts) {
        state.courts.push({ id: state.courts.length + 1, team1: [], team2: [], active: false });
      }
      while(state.courts.length > courts) {
        state.courts.pop();
      }

      const activePlayers = state.players.filter(p => p.activeStatus !== 'standby').length;
      if (activePlayers > 0) {
        const totalGamesPossible = hours * courts * 4;
        const targetPerPlayer = Math.floor((totalGamesPossible * 4) / activePlayers);
        document.getElementById('targetCalc').innerText = `~${targetPerPlayer} games / player`;
        document.getElementById('pacingCalc').innerText = `~15 mins / match`;
      }
      saveState();
    }

    function nextRound() {
      const availablePlayers = state.players.filter(p => p.activeStatus !== 'standby').sort((a, b) => {
        if (a.gamesPlayed !== b.gamesPlayed) return a.gamesPlayed - b.gamesPlayed;
        return b.restingRounds - a.restingRounds;
      });

      if (availablePlayers.length < 4) {
        alert("Need at least 4 ACTIVE players to generate matches!");
        return;
      }

      state.courts.forEach((court) => {
        const pool = availablePlayers.splice(0, 4);
        if (pool.length === 4) {
          pool.sort(() => Math.random() - 0.5);
          court.team1 = [pool[0], pool[1]];
          court.team2 = [pool[2], pool[3]];
          court.active = true;
        }
      });

      const activeIds = state.courts.flatMap(c => [...c.team1, ...c.team2]).map(p => p.id);
      state.players.forEach(p => {
        if (!activeIds.includes(p.id) && p.activeStatus !== 'standby') p.restingRounds++;
      });

      saveState();
    }

    // SWAP PLAYER ON COURT LOGIC
    function swapCourtPlayer(courtIdx, teamNum, playerIdx, newPlayerId) {
      const targetId = parseInt(newPlayerId);
      const newPlayerObj = state.players.find(p => p.id === targetId);
      if (!newPlayerObj) return;

      const court = state.courts[courtIdx];
      const targetTeam = teamNum === 1 ? court.team1 : court.team2;

      // Check if new player is already somewhere else on this court
      let existingInTeam1Idx = court.team1.findIndex(p => p.id === targetId);
      let existingInTeam2Idx = court.team2.findIndex(p => p.id === targetId);

      const oldPlayerObj = targetTeam[playerIdx];

      if (existingInTeam1Idx !== -1) {
        court.team1[existingInTeam1Idx] = oldPlayerObj;
      } else if (existingInTeam2Idx !== -1) {
        court.team2[existingInTeam2Idx] = oldPlayerObj;
      }

      targetTeam[playerIdx] = newPlayerObj;
      saveState();
    }

    function recordWinner(courtIdx, winningTeam) {
      const court = state.courts[courtIdx];
      if (!court.active) return;

      const winners = winningTeam === 1 ? court.team1 : court.team2;
      const losers = winningTeam === 1 ? court.team2 : court.team1;

      winners.forEach(w => {
        const p = state.players.find(x => x.id === w.id);
        if (p) { p.wins++; p.gamesPlayed++; p.restingRounds = 0; }
      });

      losers.forEach(l => {
        const p = state.players.find(x => x.id === l.id);
        if (p) { p.losses++; p.gamesPlayed++; p.restingRounds = 0; }
      });

      court.active = false;
      court.team1 = [];
      court.team2 = [];
      saveState();
    }

    function getPlayerSelectOptions(selectedPlayerId) {
      return state.players.map(p => `
        <option value="${p.id}" ${p.id === selectedPlayerId ? 'selected' : ''}>
          ${p.name} ${p.activeStatus === 'standby' ? '(AFK)' : ''}
        </option>
      `).join('');
    }

    function render() {
      const activeCount = state.players.filter(p => p.activeStatus !== 'standby').length;
      document.getElementById('sessionSummary').innerText = `${activeCount} Active (${state.players.length} Total) · ${state.courts.length} Court(s)`;

      const courtsContainer = document.getElementById('courtsContainer');
      courtsContainer.innerHTML = '';
      
      state.courts.forEach((court, idx) => {
        const div = document.createElement('div');
        div.className = "bg-slate-800 border border-slate-700 p-4 rounded-2xl space-y-3";
        if (court.active) {
          div.innerHTML = `
            <div class="flex justify-between items-center border-b border-slate-700/60 pb-2">
              <span class="text-xs font-bold text-green-400 uppercase">Court ${court.id}</span>
              <span class="text-[10px] text-slate-400">Tap name to swap</span>
            </div>
            <div class="grid grid-cols-2 gap-2 text-center text-xs">
              <div class="bg-slate-900/80 p-2.5 rounded-xl border border-slate-700 space-y-1.5">
                <span class="text-slate-400 block text-[10px] uppercase font-bold">Team 1</span>
                
                <select onchange="swapCourtPlayer(${idx}, 1, 0, this.value)" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-1 text-slate-200 text-xs text-center font-bold outline-none">
                  ${getPlayerSelectOptions(court.team1[0].id)}
                </select>
                <select onchange="swapCourtPlayer(${idx}, 1, 1, this.value)" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-1 text-slate-200 text-xs text-center font-bold outline-none">
                  ${getPlayerSelectOptions(court.team1[1].id)}
                </select>

                <button onclick="recordWinner(${idx}, 1)" class="mt-2 w-full bg-green-500/20 text-green-300 border border-green-500/40 py-1.5 rounded-lg font-bold">Win</button>
              </div>

              <div class="bg-slate-900/80 p-2.5 rounded-xl border border-slate-700 space-y-1.5">
                <span class="text-slate-400 block text-[10px] uppercase font-bold">Team 2</span>
                
                <select onchange="swapCourtPlayer(${idx}, 2, 0, this.value)" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-1 text-slate-200 text-xs text-center font-bold outline-none">
                  ${getPlayerSelectOptions(court.team2[0].id)}
                </select>
                <select onchange="swapCourtPlayer(${idx}, 2, 1, this.value)" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-1 text-slate-200 text-xs text-center font-bold outline-none">
                  ${getPlayerSelectOptions(court.team2[1].id)}
                </select>

                <button onclick="recordWinner(${idx}, 2)" class="mt-2 w-full bg-green-500/20 text-green-300 border border-green-500/40 py-1.5 rounded-lg font-bold">Win</button>
              </div>
            </div>
          `;
        } else {
          div.innerHTML = `
            <div class="flex justify-between items-center text-xs">
              <span class="font-bold text-slate-400">Court ${court.id}</span>
              <span class="text-slate-500 italic">Empty</span>
            </div>
          `;
        }
        courtsContainer.appendChild(div);
      });

      const activePlayerIds = state.courts.flatMap(c => [...c.team1, ...c.team2]).map(p => p.id);
      const benchList = document.getElementById('benchList');
      benchList.innerHTML = '';

      state.players.filter(p => !activePlayerIds.includes(p.id)).forEach(p => {
        const isStandby = p.activeStatus === 'standby';
        const card = document.createElement('div');
        card.className = `p-2.5 rounded-xl flex justify-between items-center text-xs border ${isStandby ? 'bg-slate-900/50 border-slate-800 opacity-60' : 'bg-slate-800/60 border-slate-700/60'}`;
        card.innerHTML = `
          <div>
            <span class="font-bold text-slate-200 block">${p.name}</span>
            <span class="text-[10px] text-slate-400">${p.gamesPlayed} games</span>
          </div>
          <span class="px-2 py-0.5 rounded-full text-[10px] ${isStandby ? 'bg-amber-900/40 text-amber-300' : 'bg-slate-700 text-slate-300'}">${isStandby ? 'AFK / Break' : 'Resting'}</span>
        `;
        benchList.appendChild(card);
      });

      const rosterList = document.getElementById('rosterList');
      rosterList.innerHTML = '';
      state.players.forEach(p => {
        const isStandby = p.activeStatus === 'standby';
        const row = document.createElement('div');
        row.className = "bg-slate-800 border border-slate-700 p-3 rounded-xl flex justify-between items-center text-xs";
        row.innerHTML = `
          <div>
            <span class="font-bold text-slate-200 block">${p.name}</span>
            <span class="text-[10px] text-slate-400">${p.gamesPlayed} played</span>
          </div>
          <div class="flex gap-2">
            <button onclick="togglePlayerStatus(${p.id})" class="px-2.5 py-1 rounded-lg font-bold text-[10px] ${isStandby ? 'bg-amber-500/20 text-amber-300 border border-amber-500/30' : 'bg-green-500/20 text-green-300 border border-green-500/30'}">
              ${isStandby ? 'Resume' : 'Pause'}
            </button>
            <button onclick="deletePlayer(${p.id})" class="text-red-400 font-bold px-1">✕</button>
          </div>
        `;
        rosterList.appendChild(row);
      });

      const leaderboardBody = document.getElementById('leaderboardBody');
      leaderboardBody.innerHTML = '';
      [...state.players].sort((a,b) => {
        const winPctA = a.gamesPlayed ? (a.wins / a.gamesPlayed) : 0;
        const winPctB = b.gamesPlayed ? (b.wins / b.gamesPlayed) : 0;
        return winPctB - winPctA;
      }).forEach(p => {
        const winPct = p.gamesPlayed ? Math.round((p.wins / p.gamesPlayed) * 100) : 0;
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="p-3 font-bold">${p.name} ${p.activeStatus === 'standby' ? '(AFK)' : ''}</td>
          <td class="p-3 text-center text-slate-400">${p.gamesPlayed}</td>
          <td class="p-3 text-center text-slate-400">${p.wins} - ${p.losses}</td>
          <td class="p-3 text-right font-bold text-green-400">${winPct}%</td>
        `;
        leaderboardBody.appendChild(tr);
      });
    }

    function resetSession() {
      if (confirm("Reset current scores and queue state?")) {
        state.players.forEach(p => { p.gamesPlayed = 0; p.wins = 0; p.losses = 0; p.restingRounds = 0; });
        state.courts.forEach(c => { c.active = false; c.team1 = []; c.team2 = []; });
        saveState();
      }
    }

    updatePlanner();
    render();
  </script>
</body>
</html>
